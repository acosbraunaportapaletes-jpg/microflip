{% extends "base.html" %}
{% block title %}{% if listing %}Edit {{ listing.title }}{% else %}New Listing{% endif %} — MicroFlip{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">{% if listing %}Edit Listing{% else %}Create Listing{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm text-neutral-400 mb-1">SaaS Name</label>
            <input type="text" name="title" required value="{{ listing.title if listing else '' }}" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Description</label>
            <textarea name="description" rows="5" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">{{ listing.description if listing else '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Product URL</label>
            <input type="url" name="url" value="{{ listing.url if listing else '' }}" placeholder="https://..." class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Asking Price (USD)</label>
                <input type="number" name="asking_price_usd" required min="1" value="{{ listing.asking_price_usd if listing else '' }}" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">MRR (USD)</label>
                <input type="number" name="mrr_usd" min="0" value="{{ listing.mrr_usd if listing else '0' }}" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
            </div>
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Stack (comma-separated)</label>
            <input type="text" name="stack" value="{{ listing.stack if listing else '' }}" placeholder="e.g. Python, Flask, PostgreSQL" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Screenshot URL (or upload below)</label>
            <input type="url" name="screenshot_url" value="" placeholder="https://..." class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Or upload screenshot</label>
            {% if listing and listing.screenshot_url %}
            <img src="{{ listing.screenshot_url }}" alt="" class="w-32 h-20 object-cover rounded mb-2 bg-neutral-800">
            {% endif %}
            <input type="file" name="screenshot" accept="image/*" class="w-full text-neutral-400 text-sm">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Status</label>
            <select name="status" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                <option value="draft" {% if listing and listing.status=='draft' %}selected{% endif %}>Draft</option>
                <option value="active" {% if listing and listing.status=='active' %}selected{% endif %}>Active (publicly visible)</option>
                {% if listing %}
                <option value="sold" {% if listing.status=='sold' %}selected{% endif %}>Sold</option>
                {% endif %}
            </select>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold">{% if listing %}Save Changes{% else %}Create Listing{% endif %}</button>
    </form>
</div>
{% endblock %}
