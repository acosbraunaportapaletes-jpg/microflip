{% extends "base.html" %}
{% block title %}Novo Listing — MicroFlip{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">Criar Listing</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Nome do SaaS</label>
            <input type="text" name="title" required class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Descrição</label>
            <textarea name="description" rows="4" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none"></textarea>
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">URL do produto</label>
            <input type="url" name="url" placeholder="https://..." class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-neutral-400 mb-1">Asking Price (USD)</label>
                <input type="number" name="asking_price" required min="1" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm text-neutral-400 mb-1">MRR declarado (USD)</label>
                <input type="number" name="mrr" min="0" value="0" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
            </div>
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Screenshot</label>
            <input type="file" name="screenshot" accept="image/*" class="w-full text-neutral-400 text-sm">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Status</label>
            <select name="status" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                <option value="draft">Rascunho</option>
                <option value="active">Ativo (visível publicamente)</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold">Criar Listing</button>
    </form>
</div>
{% endblock %}
