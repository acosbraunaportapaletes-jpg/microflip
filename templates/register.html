{% extends "base.html" %}
{% block title %}Sign Up — MicroFlip{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">Create Account</h1>
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Email</label>
            <input type="email" name="email" required class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Password (min. 6 characters)</label>
            <input type="password" name="password" required minlength="6" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">I want to...</label>
            <select name="role" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                <option value="both">Buy and Sell</option>
                <option value="buyer">Buy micro-SaaS</option>
                <option value="seller">Sell my micro-SaaS</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold">Create Account</button>
    </form>
    <p class="text-sm text-neutral-500 mt-4 text-center">Already have an account? <a href="/login" class="text-emerald-400 hover:underline">Log in</a></p>
</div>
{% endblock %}
