{% extends "base.html" %}
{% block title %}Login — MicroFlip{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">Login</h1>
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Email</label>
            <input type="email" name="email" required class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-neutral-400 mb-1">Senha</label>
            <input type="password" name="password" required class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold">Entrar</button>
    </form>
    <p class="text-sm text-neutral-500 mt-4 text-center">Não tem conta? <a href="/register" class="text-emerald-400 hover:underline">Cadastre-se</a></p>
</div>
{% endblock %}
