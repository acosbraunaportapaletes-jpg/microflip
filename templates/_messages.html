{% for m in messages %}
<div class="flex {% if m.sender_id == current_user.id %}justify-end{% else %}justify-start{% endif %}">
    <div class="max-w-[70%] {% if m.sender_id == current_user.id %}bg-emerald-900/50 border-emerald-800{% else %}bg-neutral-800 border-neutral-700{% endif %} border rounded-lg px-3 py-2">
        <div class="text-xs {% if m.sender_id == current_user.id %}text-emerald-400{% else %}text-neutral-400{% endif %} mb-1">{{ m.sender_name }}</div>
        <div class="text-sm text-white">{{ m.body }}</div>
    </div>
</div>
{% endfor %}
{% if not messages %}
<p class="text-neutral-500 text-sm text-center py-8">Nenhuma mensagem ainda. Inicie a conversa!</p>
{% endif %}
